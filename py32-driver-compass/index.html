<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PY32F002B HAL/LL 驱动库参考手册</title>
<style>
  /* ===== 主题: 仿 JetBrains Islands (Gerry Dark) 风格 =====
     原则: 低饱和、扁平、弱装饰; 信息密度优先; 语义色只用于有意义处 */
  :root{
    --bg:#1b1d21;          /* 应用背景 */
    --panel:#222428;       /* 面板/卡片 */
    --panel2:#26292e;      /* 卡片内层/悬浮 */
    --sidebar:#1e2024;     /* 侧边栏 */
    --ink:#dcdfe4;         /* 主文字 */
    --ink2:#9b9ea8;        /* 次级文字 */
    --ink3:#6b7078;        /* 弱化文字 */
    --line:#33363d;        /* 分隔线 */
    --line2:#3d4148;       /* 悬浮边框 */
    --hal:#5c9dff;         /* HAL 强调色 */
    --ll:#4db6a0;          /* LL 强调色 */
    --t-struct:#b48ce0;    /* 结构体/外设类型 */
    --t-enum:#e0a458;      /* 枚举类型 */
    --t-int:#69c3b5;       /* 整型 */
    --t-void:#8a919c;      /* void */
    --t-unk:#9aa4b2;       /* 未识别类型 */
    --mono:Consolas,"Cascadia Code","JetBrains Mono","Courier New",monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--ink);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,"Helvetica Neue",sans-serif;
    background:var(--bg);
  }
  code,kbd{font-family:var(--mono);font-size:.92em}
  a{color:var(--hal);text-decoration:none}
  a:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#3a3e45;border-radius:5px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ===== 顶栏: 标题与搜索并排 ===== */
  header.top{
    position:sticky;top:0;z-index:50;
    background:var(--panel);border-bottom:1px solid var(--line);
    padding:8px 14px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  header.top .brand{display:flex;flex-direction:column;line-height:1.25;flex:none}
  header.top h1{font-size:15px;margin:0;font-weight:700;color:var(--ink);letter-spacing:.2px}
  header.top .sub{font-size:11.5px;color:var(--ink3)}
  .searchwrap{position:relative;flex:1 1 260px;min-width:200px;max-width:560px}
  .searchwrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
  .searchwrap input[type=text]{
    width:100%;padding:6px 10px 6px 30px;border-radius:6px;
    border:1px solid var(--line2);background:#1a1c20;color:var(--ink);
    font-size:13px;outline:none;
  }
  .searchwrap input[type=text]:focus{border-color:var(--hal)}
  .searchwrap input[type=text]::placeholder{color:var(--ink3)}
  .opts{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink2);flex:none;flex-wrap:wrap}
  .opt{display:flex;align-items:center;gap:5px;user-select:none;cursor:pointer;white-space:nowrap}
  .opt input{cursor:pointer;accent-color:var(--hal)}
  .opts-inline{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:6px;padding:3px 10px}
  .stats{font-size:12px;color:var(--ink3);flex:none;white-space:nowrap}
  .stats b{color:var(--ink2)}

  /* ===== 布局 ===== */
  .layout{display:flex;align-items:flex-start}
  main{flex:1;min-width:0;padding:14px 18px 70px;max-width:1440px}

  /* ===== 侧边栏 ===== */
  nav.side{
    position:sticky;top:53px;width:218px;flex:none;
    background:var(--sidebar);border-right:1px solid var(--line);
    max-height:calc(100vh - 53px);overflow-y:auto;padding:8px 0 20px;
  }
  nav.side .side-hd{
    font-size:10.5px;color:var(--ink3);letter-spacing:1.2px;text-transform:uppercase;
    padding:8px 14px 4px;
  }
  nav.side button{
    display:flex;align-items:center;gap:8px;width:100%;
    background:none;border:none;border-left:2px solid transparent;
    padding:10px 14px;font-size:13px;color:var(--ink2);cursor:pointer;text-align:left;
  }
  nav.side button:hover{background:#26292e;color:var(--ink)}
  nav.side button.on{background:#272b31;color:#fff;border-left-color:var(--hal);font-weight:600}
  nav.side button .cnt{
    margin-left:auto;font-size:10.5px;color:var(--ink3);font-family:var(--mono);
  }
  nav.side button.on .cnt{color:var(--ink2)}
  nav.side .side-foot{font-size:10.5px;color:var(--ink3);padding:14px 14px 4px;line-height:1.6}

  /* ===== 模块区 ===== */
  section.grp{margin-bottom:22px}
  .grp-head{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
  .grp-head h2{font-size:17px;margin:0;font-weight:700}
  .grp-head h2 .cnt{font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px}
  .grp-intro{font-size:12.5px;color:var(--ink2);margin-top:3px}
  .grp-files{font-size:11px;color:var(--ink3);margin-top:4px;font-family:var(--mono)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:1050px){.cols{grid-template-columns:1fr}}
  .col-hd{
    display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
    margin:2px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);
    letter-spacing:.4px;
  }
  .col-hd .dot{width:9px;height:9px;border-radius:2px;display:inline-block}
  .col-hd .n{font-size:11px;color:var(--ink3);font-weight:400}
  .hal-col .col-hd{color:var(--hal)}
  .ll-col .col-hd{color:var(--ll)}
  .col-hd .dot.hal{background:var(--hal)}
  .col-hd .dot.ll{background:var(--ll)}
  .col-toggle{
    margin-left:auto;font-size:11px;color:var(--ink2);border:1px solid var(--line2);
    background:none;border-radius:5px;padding:2px 8px;cursor:pointer;font-weight:400;
  }
  .col-toggle:hover{background:#2b2e34;color:var(--ink)}
  .empty-note{font-size:12px;color:var(--ink3);border:1px dashed var(--line2);border-radius:6px;padding:10px;text-align:center}

  /* ===== 卡片 ===== */
  details.card{
    border:1px solid var(--line);border-radius:7px;background:var(--panel);
    margin-bottom:8px;overflow:hidden;
  }
  details.card.hal{border-left:3px solid var(--hal)}
  details.card.ll{border-left:3px solid var(--ll)}
  details.card.priv{border-left:3px solid #c9a05f}
  details.card:hover{border-color:var(--line2)}
  details.card[open]{border-color:var(--line2);background:var(--panel2)}
  details.card summary{cursor:pointer;list-style:none;padding:8px 12px;user-select:none}
  details.card summary::-webkit-details-marker{display:none}
  .card-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .badge{
    font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 6px;color:#d9dce2;
    background:#3a3f48;flex:none;letter-spacing:.3px;
  }
  .badge.macro{background:#6d5427}
  .badge.inline{background:#2f5f66}
  .badge.enum{background:#6d5427}
  .badge.struct{background:#4d3a63}
  .badge.periph{background:#38406b}
  .badge.const{background:#2d5f52}
  .badge.typedef{background:#5d3a50}
  .badge.priv{background:#6d5427}
  .fn-name{font-family:var(--mono);font-weight:700;font-size:13px;color:#e8eaf0}
  .fn-args{font-family:var(--mono);font-size:12px;color:var(--ink3)}
  .card-head .file{margin-left:auto;font-size:10.5px;color:var(--ink3);font-family:var(--mono);flex:none}
  .brief{font-size:12.5px;color:var(--ink2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  details.card[open] .brief{-webkit-line-clamp:unset;overflow:visible}

  .card-body{padding:4px 12px 11px;border-top:1px solid var(--line)}
  .sig{
    font-family:var(--mono);font-size:12.5px;background:#181a1e;color:#cfe0f5;
    border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin:10px 0;overflow-x:auto;white-space:nowrap;
  }
  .sig .rt{color:#7ab8ff}
  .sig .fnn{color:#e8b64c;font-weight:700}
  table.params{width:100%;border-collapse:collapse;font-size:12.5px;margin:7px 0}
  table.params th,table.params td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
  table.params th{background:#1d1f24;font-weight:600;color:var(--ink2);white-space:nowrap}
  table.params td.ptype{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
  .retval{font-size:12.5px;margin:6px 0}
  .retval b{color:#69c3b5}
  .notes{margin:6px 0;padding-left:20px;font-size:12.5px;color:var(--ink2)}
  .meta{font-size:11.5px;color:var(--ink3);margin-top:9px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .meta .mod{color:var(--ink2)}
  .copybtn{
    font-size:11px;color:var(--ink2);border:1px solid var(--line2);background:none;
    border-radius:5px;padding:2px 9px;cursor:pointer;margin-left:auto;
  }
  .copybtn:hover{background:#2b2e34;color:var(--ink)}
  /* 迷你"复制名称"按钮: 卡片头紧跟在名字后面 */
  .copybtn.mini{
    margin-left:0;padding:0 5px;font-size:11px;line-height:16px;border-radius:4px;
    color:var(--ink3);border-color:var(--line);flex:none;
  }
  .copybtn.mini:hover{color:var(--ink);background:#26303c}
  .card-head .copybtn.mini{opacity:.55;transition:opacity .15s ease}
  .card-head:hover .copybtn.mini{opacity:1}

  /* ===== 类型/常量 ===== */
  details.grp-box{border:1px solid var(--line);border-radius:7px;background:var(--panel);margin-top:14px;overflow:hidden}
  details.grp-box > summary{
    cursor:pointer;padding:9px 14px;display:flex;align-items:center;gap:8px;list-style:none;
    font-size:13px;font-weight:700;
  }
  details.grp-box > summary::-webkit-details-marker{display:none}
  details.grp-box > summary .arr{transition:transform .15s;color:var(--ink3);font-size:11px;flex:none}
  details.grp-box[open] > summary .arr{transform:rotate(90deg)}
  details.grp-box > summary .cnt{font-size:11.5px;color:var(--ink3);font-weight:400;margin-left:auto}
  details.card.typecard{border-left:3px solid var(--t-struct)}
  .typecard summary{background:#211f28}
  .tdef{
    font-family:var(--mono);font-size:12px;background:#181a1e;border:1px solid var(--line);color:#cfe0f5;
    border-radius:6px;padding:9px 12px;margin:10px 0;overflow-x:auto;white-space:pre-wrap;
  }
  .chips{padding:10px 14px 12px;display:flex;flex-wrap:wrap;gap:5px}
  .chipgrp{font-size:12px;font-weight:700;color:var(--ink2);width:100%;margin:8px 0 3px;border-bottom:1px solid var(--line);padding-bottom:2px}
  button.chip{
    font-family:var(--mono);font-size:11.5px;color:var(--ink2);background:#1d1f24;border:1px solid var(--line);
    border-radius:5px;padding:2px 8px;cursor:pointer;
  }
  button.chip:hover{background:#2b2e34;color:var(--ink);border-color:var(--line2)}

  /* ===== 源码折叠 ===== */
  details.srcbox{border:1px solid var(--line);border-radius:5px;margin-top:9px;background:#181a1e}
  details.srcbox > summary{
    cursor:pointer;list-style:none;padding:4px 10px;font-size:11.5px;color:var(--ink2);
    display:flex;align-items:center;gap:6px;user-select:none;
  }
  details.srcbox > summary::-webkit-details-marker{display:none}
  details.srcbox > summary .arr{transition:transform .15s;font-size:10px;color:var(--ink3)}
  details.srcbox[open] > summary .arr{transform:rotate(90deg)}
  details.srcbox .src-copy{
    margin-left:auto;font-size:10.5px;color:var(--ink2);border:1px solid var(--line2);
    background:none;border-radius:4px;padding:1px 7px;cursor:pointer;
  }
  details.srcbox .src-copy:hover{background:#2b2e34;color:var(--ink)}
  pre.codehl{
    font-family:var(--mono);font-size:12px;line-height:1.55;color:#cfe0f5;
    margin:0;padding:8px 12px;overflow-x:auto;white-space:pre;tab-size:4;
  }

  /* ===== 悬停同名标识符高亮 (缓亮缓灭: CSS 过渡 + JS 延迟熄灭防抖) ===== */
  .vtok{border-radius:3px;padding:0 1px;margin:0 -1px;transition:background-color .16s ease, color .16s ease, box-shadow .16s ease}
  .vtok.hl-var{background:#2f5d54;color:#d8f7ec;box-shadow:inset 0 0 0 1px #47897c}
  .vtok.hl-var *{color:#d8f7ec}
  mark.vtok.hl-var{background:#2f5d54;color:#d8f7ec}

  /* ===== 宏展开体代码着色 ===== */
  .c-comment{color:#7a8a7a;font-style:italic}
  .c-kw{color:#cf8e5f;font-weight:600}
  .c-num{color:#c99a5e}
  .c-reg{color:#7fa8d9}
  .c-op{color:#5d6f8a}
  .c-const{color:#61948b}
  .c-mfn{color:#b48ce0}
  .c-ph{color:#8a919c;font-style:italic}
  .t-const{color:#69c3b5}
  a.tlink.t-const{border-bottom:1px dashed #69c3b5}
  a.tlink.t-reg{color:#7fa8d9;border-bottom:1px dashed #5d8ab8}
  a.tlink.t-fn{color:#8ab4f8;border-bottom:1px dashed #5d8ab8}
  .badge.reg{background:#3a6ea5}

  /* ===== 调用关系 ===== */
  .calls{border-top:1px dashed var(--line);margin-top:9px;padding-top:7px;font-size:12px}
  .call-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:3px 0}
  .call-lbl{flex:none;color:var(--ink3);font-size:11px;letter-spacing:.3px;min-width:78px}
  a.fnlink{
    font-family:var(--mono);font-size:11.5px;color:#8ab4f8;background:#1d2433;
    border:1px solid var(--line);border-radius:4px;padding:1px 7px;cursor:pointer;text-decoration:none;
  }
  a.fnlink:hover{background:#263147;color:#cfe0f5;border-color:#3d5075}
  a.fnlink.priv{color:#c9a05f;border-style:dashed}
  a.fnlink.priv:hover{color:#e8c98a}
  .call-more{color:var(--ink3);font-size:11px}

  /* ===== 类型着色 ===== */
  .tp{font-weight:600}
  .t-struct{color:var(--t-struct)}
  .t-enum{color:var(--t-enum)}
  .t-int{color:var(--t-int)}
  .t-void{color:var(--t-void)}
  .t-unk{color:var(--t-unk)}
  a.tlink{cursor:pointer;text-decoration:none;border-bottom:1px dashed currentColor}
  a.tlink:hover{text-decoration:underline;color:#fff}

  /* ===== 扁平搜索结果 ===== */
  .sr-head{font-size:12.5px;color:var(--ink2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .sr-sec{font-size:11px;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;margin:14px 0 6px}
  .empty-hint{text-align:center;color:var(--ink3);padding:40px;font-size:13px}

  /* ===== 弹窗 ===== */
  #mask{position:fixed;inset:0;background:rgba(8,9,11,.6);z-index:100;display:none}
  #mask.open{display:block}
  #typeModal{
    position:fixed;z-index:101;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(780px,94vw);max-height:85vh;overflow:auto;background:var(--panel);
    border:1px solid var(--line2);border-radius:8px;
    box-shadow:0 14px 48px rgba(0,0,0,.5);
    display:none;padding:16px 18px;
  }
  #typeModal.open{display:block}
  #typeModal .m-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  #typeModal .m-name{font-family:var(--mono);font-size:16px;font-weight:700}
  #typeModal .m-file{font-size:11px;color:var(--ink3);font-family:var(--mono)}
  #typeModal .m-close{
    margin-left:auto;border:1px solid var(--line2);background:none;border-radius:5px;
    width:28px;height:28px;cursor:pointer;font-size:13px;color:var(--ink2);
  }
  #typeModal .m-close:hover{background:#2b2e34;color:#fff}
  #typeModal .m-desc{font-size:13px;color:var(--ink2);margin:6px 0}
  #typeModal table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  #typeModal table th,#typeModal table td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
  #typeModal table th{background:#1d1f24;color:var(--ink2)}
  #typeModal table td code{font-size:11.5px;white-space:nowrap;color:var(--ink)}
#typeModal tr.ctxrow{background:#1d2530}
#typeModal tr.ctxrow td:first-child{box-shadow:inset 3px 0 0 var(--hal)}
.ctxbadge{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;background:#26364a;color:#9cc4f0;font-size:10.5px;white-space:nowrap}

  mark{background:#5a4a1f;color:#f5e6b8;border-radius:2px;padding:0 1px}
  #toTop{
    position:fixed;right:18px;bottom:18px;z-index:60;width:36px;height:36px;border-radius:6px;
    border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font-size:15px;
    cursor:pointer;display:none;
  }
  #toTop:hover{color:#fff;background:#2b2e34}
  footer{text-align:center;color:var(--ink3);font-size:11.5px;padding:8px 0 26px}

  @media (max-width:900px){
    nav.side{
      position:static;width:100%;max-height:none;overflow-x:auto;overflow-y:hidden;
      display:flex;flex-wrap:nowrap;border-right:none;border-bottom:1px solid var(--line);
      padding:6px;
    }
    nav.side .side-hd, nav.side .side-foot{display:none}
    nav.side button{width:auto;flex:none;border-left:none;border-bottom:2px solid transparent;border-radius:5px;padding:7px 10px}
    nav.side button.on{border-bottom-color:var(--hal)}
    nav.side button .cnt{display:none}
    .layout{flex-direction:column}
  }
</style>
</head>

<header class="top">
  <div class="brand">
    <h1>PY32_Driver_Compass</h1>
    <span class="sub">PY32F002B HAL/LL 驱动库参考手册 · PY32F002B_Firmware_V1.2.1</span>
  </div>
  <div class="searchwrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

</header>

</div>

<script>
"use strict";
/* ================= 模块合并(构建期与浏览器共用同一份实现, 由 build.mjs 内联) ================= */
function mergeModules(mods, order, displayName){
  const dedupByName = (arr) => {
    const seen = new Set(); const out = [];
    for (const x of arr || []) {
      if (!x || !x.name) continue;
      if (seen.has(x.name)) continue;
      seen.add(x.name); out.push(x);
    }
    return out;
  };
  const merged = [];
  for (const m of mods) {
    if (!m || !m.moduleId) continue;
    const exist = merged.find(x => x.moduleId === m.moduleId);
    if (!exist) {
      merged.push({
        ...m,
        module: (displayName && displayName[m.moduleId]) || m.module,
        hal: dedupByName(m.hal), ll: dedupByName(m.ll),
        types: dedupByName(m.types), consts: dedupByName(m.consts)
      });
    } else {
      exist.hal    = dedupByName([...(exist.hal || []),    ...(m.hal || [])]);
      exist.ll     = dedupByName([...(exist.ll || []),     ...(m.ll || [])]);
      exist.types  = dedupByName([...(exist.types || []),  ...(m.types || [])]);
      exist.consts = dedupByName([...(exist.consts || []), ...(m.consts || [])]);
      exist.files  = [...new Set([...(exist.files || []), ...(m.files || [])])];
      if (!exist.intro && m.intro) exist.intro = m.intro;   // 保留第一个(主文件)的 intro
    }
  }
  const ord = order || [];
  merged.sort((a, b) => {
    const ia = ord.indexOf(a.moduleId), ib = ord.indexOf(b.moduleId);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  return merged;
}
/* ================= 展开状态持久化(重渲染不丢) ================= */
const openSet = new Set();    // 已展开: 'fn:名字' / 'type:名字' / 'src:名字' / 'grp:类型或常量'
const closedSrc = new Set();  // 用户手动收起的源码折叠(搜索命中时不再自动展开)
function detailsKey(d){
  if (d.classList.contains('srcbox')) return 'src:' + (d.closest('details.card')?.dataset.name || '');
  if (d.classList.contains('typecard')) return 'type:' + d.dataset.name;
  if (d.classList.contains('grp-box')) return 'grp:' + (d.dataset.kind || 'box');
  return 'fn:' + d.dataset.name;
}
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!(d instanceof Element) || !d.matches('details.card, details.srcbox, details.grp-box')) return;
  const key = detailsKey(d);
  if (d.open) { openSet.add(key); closedSrc.delete(key); }
  else { openSet.delete(key); if (d.classList.contains('srcbox')) closedSrc.add(key); }
}, true);

/* ================= 数据加载与索引 ================= */
/* 单文件版: 数据内嵌在 #docdata; nginx 拆分版: 从 data.json fetch */
let MODULES = [];
let REGS = [];             // 寄存器清单: {name, candidates:[{periph,offset,desc}], zh?, note?}
let PRIVATES = [];         // 私有函数: {name, sig, src, file, module, inline}

const typeReg = new Map();   // 类型名 -> {entry, module}
const constReg = new Map();  // 常量名 -> {entry, module}
const regReg = new Map();    // 寄存器名 -> entry
const callGraph = new Map(); // 函数名 -> {calls, refs, calledBy, refBy, priv}
const entryNameSet = new Set();   // 文档化函数/宏名(源码内可点击跳转)
let codeHLModule = '';            // 当前渲染卡片的模块 id(源码内 ->REG 的上下文兜底)
const memberTypeReg = new Map();  // '所属类型|成员名' -> 成员类型(用于 -> / . 链式类型跳转)
const memberGlobalReg = new Map(); // '成员名' -> { type, owners:Set } 成员名唯一时的兜底
function buildIndex(){
  typeReg.clear(); constReg.clear(); regReg.clear(); entryNameSet.clear();
  memberTypeReg.clear(); memberGlobalReg.clear();
  for (const m of MODULES) {
    for (const t of (m.types || [])) {
      typeReg.set(t.name, { entry: t, mod: m });
      // 结构体成员的类型索引: 供源码里 huart->Init 这样的链式跳转(Init → UART_InitTypeDef 卡片)
      for (const mem of (t.members || [])) {
        const mt = baseTypeOf(mem.type);
        if (!mem.name || !mt) continue;
        memberTypeReg.set(t.name + '|' + mem.name, mt);
        if (!memberGlobalReg.has(mem.name)) memberGlobalReg.set(mem.name, { type: mt, owners: new Set() });
        const g = memberGlobalReg.get(mem.name);
        g.owners.add(t.name);
        if (g.type !== mt) g.type = '';   // 同名成员在不同结构体里类型不一致 → 不能兜底
      }
    }
    for (const c of (m.consts || [])) constReg.set(c.name, { entry: c, mod: m });
    for (const lib of ['hal', 'll']) for (const f of (m[lib] || [])) entryNameSet.add(f.name);
  }
  for (const r of REGS) regReg.set(r.name, r);
}
/* 去掉指针/限定符/数组, 取基础类型名: 'const UART_InitTypeDef *' → 'UART_InitTypeDef'
   注意: 限定符 __IO/__I/__O 以 `_` 开头, **不能用 \b 前缀**(起始处无词边界, 会匹配失败);
        也不能整体删数字(会把 uint16_t 拆成 uint _t) */
function baseTypeOf(t){
  let s = String(t || '');
  s = s.replace(/\b(?:const|volatile|struct|enum|union|unsigned|signed)\b/g, ' ');
  s = s.replace(/__IOM|__IO|__I|__O/g, ' ');
  s = s.replace(/\*/g, ' ').replace(/\[[^\]]*\]/g, ' ');
  s = s.replace(/\b\d+\b/g, ' ');   // 独立的位数/维度数字(不会切断 uint16_t 这类词)
  const m = s.trim().match(/([A-Za-z_]\w*)\s*$/);
  return m ? m[1] : '';
}
/* 成员类型查询: 优先按所属类型精确查, 否则用"成员名唯一"的兜底 */
function memberTypeOf(ownerType, member){
  if (ownerType) {
    const hit = memberTypeReg.get(ownerType + '|' + member);
    if (hit) return hit;
  }
  const g = memberGlobalReg.get(member);
  if (g && g.type && g.owners.size === 1) return g.type;
  return '';
}
/* 当前卡片的"变量 → 类型"表(源码里 huart → UART_HandleTypeDef 的起点), 见 setCodeHLCtx */
let codeHLVars = new Map();
/* 从函数参数 + 源码里的局部声明, 收集 变量名 → 基础类型名 */
function collectVars(f){
  const vars = new Map();
  const put = (name, type) => {
    const bt = baseTypeOf(type);
    if (name && bt && !vars.has(name)) vars.set(name, bt);
  };
  for (const p of (f.params || [])) put(p.name, p.type);
  const src = String(f.src || '');
  // 局部声明: "  UART_InitTypeDef Init; " / "  const uint8_t *p = ..." / "  uint32_t a, b;"
  const re = /^[ \t]*(?:register\s+|static\s+|const\s+|volatile\s+|__IO\s+)*([A-Za-z_]\w*)\s+(\*?\s*[A-Za-z_]\w*)\s*(?:\[[^\]]*\])?\s*[;=,)]/gm;
  let m;
  while ((m = re.exec(src)) !== null) put(m[2].replace('*', '').trim(), m[1]);
  return vars;
}
function setCodeHLCtx(f){
  codeHLVars = f ? collectVars(f) : new Map();
}
function loadCallGraph(g){
  callGraph.clear();
  for (const [n, node] of Object.entries(g || {})) callGraph.set(n, node);
}
function fnChip(name, opts){
  const priv = opts && opts.priv;
  return `<a class="fnlink${priv ? ' priv' : ''}" data-fn="${esc(name)}" title="${priv ? '私有函数(static) · 点击搜索源码中的使用处' : '点击搜索该函数'}">${esc(name)}</a>`;
}
function callRow(lbl, list, total, isPrivFn){
  if (!list.length) return '';
  const chips = list.map(n => fnChip(n, { priv: isPrivFn(n) })).join('');
  const more = total - list.length;
  return `<div class="call-row"><span class="call-lbl">${lbl} (${total})</span>${chips}${more > 0 ? `<span class="call-more">+${more}</span>` : ''}</div>`;
}
function callInfoHTML(name){
  const node = callGraph.get(name);
  if (!node) return '';
  const priv = n => { const nd = callGraph.get(n); return nd ? !!nd.priv : false; };
  const cap = arr => arr.slice(0, 40);
  const rows = [
    callRow('被调用', cap(node.calledBy || []), (node.calledBy || []).length, priv),
    callRow('被引用', cap(node.refBy || []), (node.refBy || []).length, priv),
    callRow('调用了', cap(node.calls || []), (node.calls || []).length, priv),
    callRow('引用了', cap(node.refs || []), (node.refs || []).length, priv)
  ].filter(Boolean).join('');
  return rows ? `<div class="calls">${rows}</div>` : '';
}

/* ================= 工具函数 ================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const KIND_LABEL = { function:'函数', macro:'宏', inline:'内联函数', priv:'私有' };
const TY_KIND_LABEL = { enum:'枚举', struct:'结构体', periph:'外设寄存器', typedef:'类型别名' };

function typeClass(tn){
  const t = typeReg.get(tn);
  if (t) return t.entry.kind === 'enum' ? 't-enum' : 't-struct';
  if (/^(u?int(8|16|32|64)_t|uint\d+_t|char|float|double|long|short|ErrorStatus|bool|size_t|FlagStatus|ITStatus|FunctionalState)$/.test(tn)) return 't-int';
  if (tn === 'void') return 't-void';
  return 't-unk';
}

/* 类型字符串 → 带颜色/链接的 HTML (标识符附 data-var, 可参与悬停同名高亮) */
function renderType(tstr){
  let s = String(tstr).trim();
  const m = s.match(/^([A-Za-z_]\w*)([\s\*]+)?$/);
  if (m) {
    const base = m[1], rest = m[2] || '';
    const cls = typeClass(base);
    const isLink = typeReg.has(base);
    const inner = isLink
      ? `<a class="tlink ${cls}" data-type="${esc(base)}" title="点击查看定义">${esc(base)}</a>`
      : `<span class="tp ${cls}">${esc(base)}</span>`;
    return `<span class="vtok" data-var="${esc(base)}">${inner}</span>` + esc(rest);
  }
  return `<span class="tp t-unk">${esc(s)}</span>`;
}

function titleOf(f){
  const ps = (f.params || []).map(p => p.name);
  const args = ps.length > 6 ? ps.slice(0, 6).join(', ') + ', …' : ps.join(', ');
  return f.name + '(' + args + ')';
}

/* ================= 搜索 ================= */
/* curScopes: 多选范围(名称/描述/源码), 满足任一范围即命中; 默认仅名称 */
let curTokens = [], curCase = false, curScopes = ['name'], curHL = true;

function tokenize(q){ return q.trim().split(/\s+/).filter(Boolean); }
function hasMatch(text, tok, cs){ return cs ? text.includes(tok) : text.toLowerCase().includes(tok.toLowerCase()); }
function entryText(f, scope){
  if (scope === 'src') return f.src || '';
  const nameT = [f.name, titleOf(f), (f.params||[]).map(p=>p.name).join(' ')].join(' ');
  const descT = [f.brief || '', (f.params||[]).map(p=>p.desc||'').join(' '),
                 f.retval ? f.retval.desc||'' : '', (f.notes||[]).join(' ')].join(' ');
  return scope === 'name' ? nameT : descT;
}
function entryMatch(f, tokens, cs, scopes){
  if (!tokens.length) return true;
  return scopes.some(sc => tokens.every(t => hasMatch(entryText(f, sc), t, cs)));
}
function hl(text, tokens, cs){
  if (!curHL || !tokens.length || !text) return esc(text);
  const re = new RegExp(tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), cs ? 'g' : 'gi');
  return esc(text).replace(re, m => `<mark>${m}</mark>`);
}

/* 宏/源码轻量 C 语法着色: 单遍扫描, 一次性分类每个 token。
   关键: 插入的 <a>/<span> 标签不会再被后续步骤扫描(避免标签属性被二次着色而损坏)。 */
const MACRO_FUNCS = new Set([
  'SET_BIT','CLEAR_BIT','SET_REG','CLEAR_REG','READ_BIT','READ_REG','WRITE_REG','MODIFY_REG',
  'LL_SET_BIT','LL_CLEAR_BIT','LL_READ_BIT','LL_READ_REG','LL_WRITE_REG','LL_MODIFY_REG','LL_MULTIPLY'
]);
const C_KEYWORDS = new Set([
  'if','else','do','while','for','return','switch','case','break','continue','default',
  'static','const','volatile','struct','union','enum','typedef','extern','register','goto','sizeof',
  'signed','unsigned','inline','restrict','asm'
]);
function codeHL(text){
  let s = esc(text);
  // 搜索词高亮(先于着色, 只作用于纯文本)
  if (curHL && curTokens.length) {
    const re = new RegExp(curTokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), curCase ? 'g' : 'gi');
    s = s.replace(re, m => `<mark>${m}</mark>`);
  }
  // 实体必须先于单字符规则匹配: esc() 已把 & < > " 变成 &amp; &lt; &gt; &quot;,
  // 否则 "&amp;" 会被拆成 "&" + 标识符 "amp" + ";" 从而在页面上显示出字面量 &amp; (踩坑)
  const TOKEN = /\/\*[\s\S]*?\*\/|\/\/[^\n]*|&(?:amp|lt|gt|quot|apos|nbsp|#\d+|#x[0-9A-Fa-f]+);|0[xX][0-9A-Fa-f]+[uUlL]*|\d+[uUlL]*|-&gt;[A-Za-z_]\w*|[A-Za-z_]\w*|[^A-Za-z0-9_]/y;
  let out = '', i = 0;
  let prevIdent = '';   // 上一个标识符: 用于在 ->NAME 处推断"从哪个外设实例点进来"
  let lastType = '';    // 上一个标识符/成员的类型: 供 -> 与 . 做链式类型跳转
  let pendingMember = false;   // 上一个 token 是 -> 或 .: 下一个标识符按成员解析
  while (i < s.length) {
    if (s[i] === '<') {                 // 已有标签(搜索高亮的 mark), 原样跳过
      let j = s.indexOf('>', i);
      if (j === -1) j = s.length - 1;
      const tag = s.slice(i, j + 1);
      if (tag === '<mark>') {
        // 搜索命中的词也要能悬停高亮: 把 <mark> 文本取出, 附上 data-var 再放回
        const close = s.indexOf('</mark>', j + 1);
        if (close !== -1) {
          const inner = s.slice(j + 1, close);
          if (/^[A-Za-z_]\w*$/.test(inner)) {
            out += `<mark class="vtok" data-var="${esc(inner)}">${inner}</mark>`;
            prevIdent = inner;
            i = close + '</mark>'.length;
            continue;
          }
        }
      }
      out += tag;
      i = j + 1;
      continue;
    }
    TOKEN.lastIndex = i;
    const m = TOKEN.exec(s);
    if (!m) { out += s[i]; i++; continue; }
    const tok = m[0];
    if (tok.startsWith('/*') || tok.startsWith('//')) {
      out += `<span class="c-comment">${tok}</span>`;
    } else if (tok.startsWith('&') && tok.endsWith(';')) {
      out += tok;   // HTML 实体(&amp; &lt; 等): 原样输出, 不再当标识符处理
    } else if (tok === ';' || tok === '}' || tok === '{') {
      prevIdent = ''; lastType = ''; pendingMember = false;
      out += tok;
    } else if (tok === '.') {
      pendingMember = true;   // 结构体成员访问: 下一个标识符按"上一个类型"的成员解析
      out += tok;
    } else if (/^0[xX]/.test(tok) || /^\d/.test(tok)) {
      out += `<span class="c-num">${tok}</span>`;
    } else if (tok.startsWith('-&gt;')) {
      const reg = tok.slice('-&gt;'.length);
      const mType = (!regReg.has(reg) && lastType) ? memberTypeOf(lastType, reg) : '';
      if (regReg.has(reg)) {
        // 上下文外设: 优先用 -> 前面的实例名, 其次用当前卡片所属模块
        const ctx = periphFromInstance(prevIdent) || MODULE_PERIPH[codeHLModule] || '';
        out += `<span class="c-op">-&gt;</span><a class="tlink t-reg" data-reg="${esc(reg)}" data-var="${esc(reg)}" data-ctx="${esc(ctx)}" title="点击查看寄存器详情${ctx ? '（' + periphShortName(ctx) + ' 上下文）' : ''}">${reg}</a>`;
        lastType = ''; pendingMember = false;
      } else if (mType && typeReg.has(mType)) {
        // 链式成员跳转: huart->Init 里的 Init → UART_InitTypeDef 卡片
        out += `<span class="c-op">-&gt;</span><span class="vtok" data-var="${esc(reg)}"><a class="tlink ${typeClass(mType)}" data-type="${esc(mType)}" title="点击查看 ${esc(mType)} 定义（${esc(lastType)} 的成员）">${esc(reg)}</a></span>`;
        prevIdent = reg; lastType = mType; pendingMember = false;
      } else {
        out += `<span class="c-reg" data-var="${esc(reg)}">${tok}</span>`;
        lastType = ''; pendingMember = false;
      }
    } else if (/^[A-Za-z_]/.test(tok)) {
      const w = tok;
      prevIdent = w;
      let inner;
      let hoverable = true;   // 关键字不参与同名高亮(否则悬停 if/return 会满屏标亮)
      let newLastType = '';
      const varType = pendingMember ? '' : codeHLVars.get(w);          // 参数/局部变量 → 其类型
      const memType = (pendingMember && lastType) ? memberTypeOf(lastType, w) : '';   // 成员 → 成员类型
      if (memType && typeReg.has(memType)) {
        inner = `<a class="tlink ${typeClass(memType)}" data-type="${esc(memType)}" title="点击查看 ${esc(memType)} 定义（${esc(lastType)} 的成员）">${w}</a>`;
        newLastType = memType;
      } else if (varType && typeReg.has(varType)) {
        inner = `<a class="tlink ${typeClass(varType)}" data-type="${esc(varType)}" title="点击查看 ${esc(varType)} 定义">${w}</a>`;
        newLastType = varType;
      } else if (typeReg.has(w)) {
        inner = `<a class="tlink ${typeClass(w)}" data-type="${w}" title="点击查看定义">${w}</a>`;
        newLastType = w;
      } else {
        const cls = typeClass(w);
        if (cls !== 't-unk') inner = `<span class="tp ${cls}">${w}</span>`;
        else if (entryNameSet.has(w)) inner = `<a class="tlink t-fn" data-fn="${w}" title="点击查看该函数/宏">${w}</a>`;
        else if (C_KEYWORDS.has(w)) { inner = `<span class="c-kw">${w}</span>`; hoverable = false; }
        else if (constReg.has(w)) inner = `<a class="tlink t-const" data-type="${w}" title="点击查看定义">${w}</a>`;
        else if (MACRO_FUNCS.has(w)) inner = `<span class="c-mfn">${w}</span>`;
        else if (/^[A-Z_][A-Z0-9_]{2,}$/.test(w)) inner = `<span class="c-const">${w}</span>`;
        else if (w.startsWith('__') && w !== '__I' && w !== '__O' && w !== '__IO') inner = `<span class="c-ph">${w}</span>`;
        else inner = esc(w);
      }
      // 包一层便于悬停(保留内层链接/着色的语义与样式)
      out += hoverable ? `<span class="vtok" data-var="${esc(w)}">${inner}</span>` : inner;
      lastType = newLastType;
      pendingMember = false;
    } else {
      out += tok;
      pendingMember = false;   // 其它符号(括号/逗号/运算符等)中断成员链
    }
    i += tok.length;
  }
  return out;
}

/* ================= 卡片渲染 ================= */
function renderFuncCard(f, lib, showMod){
  setCodeHLCtx(f);   // 采集 变量→类型(参数 + 局部声明), 供源码里的链式类型跳转
  const ps = (f.params || []);
  const nameHL = hl(f.name, curTokens, curCase);
  // 卡片摘要(展开前的预览)里的简写参数列表: 只做搜索高亮, **不参与悬停高亮**(用户要求)
  const argsHL = ps.map(p => hl(p.name, curTokens, curCase)).join(', ') + (ps.length > 6 ? ', …' : '');
  const brief = hl(f.brief || '', curTokens, curCase);
  const params = ps.map(p => `
    <tr>
      <td><span class="vtok" data-var="${esc(p.name)}">${esc(p.name)}</span></td>
      <td class="ptype">${renderType(p.type || '')}</td>
      <td>${hl(p.desc || '', curTokens, curCase)}</td>
    </tr>`).join('');
  /* 宏没有返回类型: 显示 #define 原文(优先用提取的逐字 src, 避免子代理压缩的中文摘要); 普通函数才拼 返回类型 名称(参数) */
  const isMacro = f.kind === 'macro' || String(f.sig || '').trim().startsWith('#define');
  const sig = isMacro
    ? `<span class="rt">#define</span> ${codeHL(String(f.src || f.sig).replace(/^#define\s*/, ''))}`
    : f.kind === 'priv'
      ? `<span class="fnn">${codeHL(f.sig)}</span>`
      // 类型与参数名各自独立成 span(不能把类型嵌进参数名的 span 里 — 否则高亮参数名时
      // 外层背景会把前面的类型一起染色, 踩过坑: 悬停 huart 连带 UART_HandleTypeDef 也亮)
      : `<span class="rt">${renderType(f.retval ? f.retval.type : 'void')}</span> <span class="fnn">${esc(f.name)}</span>(${ps.map(p => `<span>${renderType(p.type || '')}</span> <span class="vtok" data-var="${esc(p.name)}">${esc(p.name)}</span>`).join(', ')})`;
  const notes = (f.notes || []).length ? `<ul class="notes">${f.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '';
  const retval = f.retval && f.retval.desc ? `<div class="retval"><b>返回:</b> ${esc(f.retval.desc)}</div>` : '';
  const srcLines = f.src ? f.src.split('\n').length : 0;
  /* 搜索词命中源码时自动展开折叠(除非用户手动收起过); 其余按持久化状态 */
  const srcKey = 'src:' + f.name;
  const srcHit = curTokens.length && f.src && curTokens.some(t => hasMatch(f.src, t, curCase));
  const srcOpen = (srcHit && !closedSrc.has(srcKey)) || openSet.has(srcKey);
  const srcFold = f.src ? `
  <details class="srcbox"${srcOpen ? ' open' : ''}>
    <summary><span class="arr">▶</span>源码 <span style="color:var(--ink3);font-weight:400">(${srcLines} 行)</span><button class="src-copy" title="复制完整源码">复制源码</button></summary>
    <pre class="codehl">${codeHL(f.src)}</pre>
  </details>` : '';
  return `
  <details class="card ${lib}" data-name="${esc(f.name)}"${openSet.has('fn:' + f.name) ? ' open' : ''}>
    <summary>
      <div class="card-head">

function renderTypesBlock(m, showMod){

/* ================= 私有函数 ================= */
function parseSigParams(sig){
  const m = String(sig || '').match(/\(([^)]*)\)/);
  if (!m) return [];
  let depth = 0, cur = '', out = [];
  for (const ch of m[1]) {
    if (ch === '(' || ch === '[') depth++;
    else if (ch === ')' || ch === ']') depth--;
    if (ch === ',' && depth === 0) { out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  if (cur.trim()) out.push(cur);
  return out.map(part => {
    const t = part.trim().replace(/\s+/g, ' ');
    const nm = (t.match(/([A-Za-z_]\w*)\s*$/) || [])[1] || '';
    const ty = nm ? t.slice(0, t.length - nm.length).trim() : t;
    return { type: ty, name: nm };
  }).filter(p => p.name && p.type);
}
function privEntry(p){
  const node = callGraph.get(p.name) || {};
  const callerN = (node.calledBy || []).length;
  return {
    name: p.name, sig: p.sig,
    brief: `私有函数(${p.inline ? '头文件内联' : 'static'}), 定义于 ${p.file}, 被 ${callerN} 处调用。`,
    params: parseSigParams(p.sig), retval: null, notes: [], file: p.file,
    kind: 'priv', src: p.src, module: p.module
  };
}
function privMatch(p, tokens, cs, scopes){
  if (!tokens.length) return true;
  return scopes.some(sc => {
    const text = sc === 'name' ? p.name
               : sc === 'desc' ? p.sig
               : sc === 'src' ? (p.src || '')
               : p.name + ' ' + p.sig + ' ' + (p.src || '');
    return tokens.every(t => hasMatch(text, t, cs));
  });
}
function renderPrivates(m, showMod){
  const list = PRIVATES.filter(p => p.module === m.moduleId);
  if (!list.length) return '';
  const groups = new Map();
  for (const p of list) { if (!groups.has(p.file)) groups.set(p.file, []); groups.get(p.file).push(p); }
  let body = '';
  for (const [file, ps] of groups) {
    body += `<div class="chipgrp">${esc(file)}</div>`;
    body += ps.map(p => renderFuncCard(privEntry(p), 'priv', m.module)).join('');
  }
  return `<details class="grp-box" data-kind="priv"${openSet.has('grp:priv') ? ' open' : ''}><summary><span class="arr">▶</span>私有函数<span class="cnt">${list.length} 项</span></summary><div style="padding:12px 14px">${body}</div></details>`;
}

/* ================= 模块视图 ================= */
function colHtml(m, lib, showMod){
  const list = lib === 'hal' ? (m.hal||[]) : (m.ll||[]);

  const allOpen = n > 0 && list.every(f => openSet.has('fn:' + f.name));
  const hd = `<div class="col-hd"><span class="dot ${lib}"></span>${lib === 'hal' ? 'HAL' : 'LL'} 库 <span class="n">(${n})</span>` +
             (n ? `<button class="col-toggle" data-col="${lib}" data-module="${esc(m.moduleId)}">${allOpen ? '全部收起' : '展开全部'}</button>` : '') + `</div>`;
  if (!n) return `<div class="${lib}-col">${hd}<div class="empty-note">该模块无 ${lib.toUpperCase()} 驱动</div></div>`;
  return `<div class="${lib}-col">${hd}${list.map(f => renderFuncCard(f, lib, showMod)).join('')}</div>`;
}

function renderModule(m){
  codeHLModule = m.moduleId;   // 源码内 ->REG 的上下文兜底(如 I2C 模块里的 Instance->CCR)
  const halN = (m.hal||[]).length, llN = (m.ll||[]).length;

}

function kindCounts(list){
  let f = 0, m = 0, i = 0;
  for (const x of list) { if (x.kind === 'macro') m++; else if (x.kind === 'inline') i++; else f++; }
  return { f, m, i };
}
function totalKinds(){
  const all = [];
  for (const m of MODULES) for (const lib of ['hal', 'll']) for (const x of (m[lib] || [])) all.push(x);
  return kindCounts(all);
}

/* ================= 主渲染 ================= */
function render(){
  /* 重建会丢弃旧 DOM: 悬停高亮的元素引用随之失效, 先清掉状态 */
  if (typeof clearVarHl === 'function') { if (hlVarTimer) { clearTimeout(hlVarTimer); hlVarTimer = null; } clearVarHl(); }
  /* 重建前快照当前展开状态(toggle 事件异步, 这里兜底): 开着的记入 openSet, 当前折叠的 srcbox 记入 closedSrc */
  /* 重建前快照当前展开状态(toggle 事件异步, 这里兜底): 只记录"当前展开"的。
     closedSrc(用户手动收起)只由 toggle 事件产生, 快照不推断, 避免误伤搜索自动展开 */
  document.querySelectorAll('details.card, details.srcbox, details.grp-box').forEach(d => {
    const key = detailsKey(d);
    if (d.open) { openSet.add(key); closedSrc.delete(key); }
  });
  const searching = curTokens.length > 0;
  const main = document.getElementById('main');
  let total = 0;

  if (searching) {
    /* 扁平结果: 不按模块分组, HAL/LL 靠颜色区分, 不显示空列提示 */
    let fnCards = '', pvCards = '', tyCards = '', chips = '';
    let fnN = 0, pvN = 0, tyN = 0, coN = 0;
    const fnKinds = { f: 0, m: 0, i: 0 };
    for (const m of MODULES) {
      codeHLModule = m.moduleId;
      for (const f of (m.hal||[])) if (entryMatch(f, curTokens, curCase, curScopes)) { fnCards += renderFuncCard(f, 'hal', m.module); fnN++; fnKinds[f.kind === 'macro' ? 'm' : f.kind === 'inline' ? 'i' : 'f']++; }
      for (const f of (m.ll||[]))  if (entryMatch(f, curTokens, curCase, curScopes)) { fnCards += renderFuncCard(f, 'll',  m.module); fnN++; fnKinds[f.kind === 'macro' ? 'm' : f.kind === 'inline' ? 'i' : 'f']++; }
      for (const t of (m.types||[])) if (typeMatch(t, curTokens, curCase, curScopes)) { tyCards += renderTypeCard(t, m.module); tyN++; }
      for (const c of (m.consts||[])) if (constMatch(c, curTokens, curCase, curScopes)) { chips += `<button class="chip" data-const="${esc(c.name)}" data-mod="${esc(m.module)}" title="${esc((c.value||'')+' — '+(c.desc||''))}">${hl(c.name, curTokens, curCase)}</button>`; coN++; }
    }
    if (curScopes.includes('priv')) {
      for (const p of PRIVATES) if (privMatch(p, curTokens, curCase, curScopes)) { pvCards += renderFuncCard(privEntry(p), 'priv', p.module); pvN++; }
    }
    total = fnN + pvN + tyN + coN;
    const parts = [`函数 <b>${fnKinds.f}</b>`];
    if (fnKinds.m) parts.push(`宏 <b>${fnKinds.m}</b>`);
    if (fnKinds.i) parts.push(`内联 <b>${fnKinds.i}</b>`);
    main.innerHTML = `
      <div class="sr-head">匹配 <b>${total}</b> 项: ${parts.join(' · ')} · 私有 ${pvN} · 类型 ${tyN} · 常量 ${coN}<span style="color:var(--ink3)"> — 在全部模块中扁平搜索, HAL=蓝 / LL=绿 / 私有=棕</span></div>
      <div class="cols" style="grid-template-columns:1fr">${fnCards}${pvCards}</div>
      ${tyN ? `<div class="sr-sec">类型</div>${tyCards}` : ''}
      ${coN ? `<div class="sr-sec">常量</div><div class="chips">${chips}</div>` : ''}
      ${total ? '' : '<div class="empty-hint">没有匹配的结果, 换个关键词试试?</div>'}`;
  } else {
    const m = MODULES.find(x => x.moduleId === curModule) || MODULES[0];
    main.innerHTML = renderModule(m);
  }

  const tk = totalKinds();
  document.getElementById('stats').innerHTML = searching
    ? `<b>${total}</b> 项结果`
    : `函数 <b>${tk.f}</b> · 宏 <b>${tk.m}</b> · 内联 <b>${tk.i}</b> · 私有 <b>${PRIVATES.length}</b> · 类型 <b>${typeReg.size}</b> · 常量 <b>${constReg.size}</b>`;
}
function typeMatch(t, tokens, cs, scopes){
  if (!tokens.length) return true;
  const textOf = sc => sc==='desc' ? (t.desc||'')+' '+(t.members||[]).map(x=>x.desc||'').join(' ')
                   : sc==='name' ? t.name+' '+(t.members||[]).map(x=>x.name).join(' ')
                   : (t.def||'');
  return scopes.some(sc => tokens.every(tok => hasMatch(textOf(sc), tok, cs)));
}
function constMatch(c, tokens, cs, scopes){
  if (!tokens.length) return true;
  const textOf = sc => sc==='desc' ? (c.desc||'')
                   : sc==='name' ? c.name
                   : (c.src||'')+' '+(c.value||'');
  return scopes.some(sc => tokens.every(tok => hasMatch(textOf(sc), tok, cs)));
}

/* 实例名/模块 → 候选外设(用于寄存器弹窗"从哪个外设点进来"的上下文定位) */
const INSTANCE_PERIPH = {
  I2Cx:'I2C_TypeDef', I2C1:'I2C_TypeDef', I2C:'I2C_TypeDef',
  ADC:'ADC_Common_TypeDef', ADC1_COMMON:'ADC_Common_TypeDef', ADCxy_COMMON:'ADC_Common_TypeDef', ADC_COMMON:'ADC_Common_TypeDef', ADC1:'ADC_Common_TypeDef',
  TIMx:'TIM_TypeDef', TIM1:'TIM_TypeDef', TIM14:'TIM_TypeDef', TIM:'TIM_TypeDef',
  GPIOx:'GPIO_TypeDef', GPIOA:'GPIO_TypeDef', GPIOB:'GPIO_TypeDef', GPIOC:'GPIO_TypeDef',
  USARTx:'USART_TypeDef', USART1:'USART_TypeDef', SPIx:'SPI_TypeDef', SPI1:'SPI_TypeDef',
  LPTIMx:'LPTIM_TypeDef', LPTIM1:'LPTIM_TypeDef', IWDG:'IWDG_TypeDef', PWR:'PWR_TypeDef',
  FLASH:'FLASH_TypeDef', CRC:'CRC_TypeDef', EXTI:'EXTI_TypeDef', RCC:'RCC_TypeDef',
  SYSCFG:'SYSCFG_TypeDef', DBGMCU:'DBGMCU_TypeDef',
  COMP:'COMP_TypeDef', COMP1:'COMP_TypeDef', COMP2:'COMP_TypeDef', COMP12_COMMON:'COMP_Common_TypeDef',
  SCB:'SCB_Type', NVIC:'NVIC_Type', SysTick:'SysTick_Type'
};
const MODULE_PERIPH = {
  adc:'ADC_Common_TypeDef', i2c:'I2C_TypeDef', spi:'SPI_TypeDef', tim:'TIM_TypeDef',
  usart:'USART_TypeDef', uart:'USART_TypeDef', gpio:'GPIO_TypeDef', lptim:'LPTIM_TypeDef',
  iwdg:'IWDG_TypeDef', pwr:'PWR_TypeDef', flash:'FLASH_TypeDef', crc:'CRC_TypeDef',
  exti:'EXTI_TypeDef', rcc:'RCC_TypeDef', comp:'COMP_TypeDef', cortex:'SCB_Type'
};
function periphShortName(p){ return String(p || '').replace(/_Type(Def)?$/, ''); }
/* 从实例名(如 I2Cx / ADCxy_COMMON / htim->Instance 的前缀)推断候选外设 */
function periphFromInstance(name){
  if (!name) return '';
  if (INSTANCE_PERIPH[name]) return INSTANCE_PERIPH[name];
  const m = String(name).match(/^([A-Za-z]+?)(?:xy|xx|_COMMON|\d+)?(?:_[A-Z]+)?$/);
  if (m && INSTANCE_PERIPH[m[1]]) return INSTANCE_PERIPH[m[1]];
  return '';
}
function showReg(name, ctxPeriph){

    <table><tr><th style="width:170px">外设结构体</th><th style="width:80px">偏移</th><th style="width:190px">中文名</th><th>用途</th></tr>${rows}</table>

  el.classList.add('open');
  document.getElementById('mask').classList.add('open');

function instanceNames(periph){
  const map = {
    GPIO_TypeDef: 'GPIOA / GPIOB / GPIOC',
    USART_TypeDef: 'USART1',
    TIM_TypeDef: 'TIM1 / TIM14',
    SPI_TypeDef: 'SPI1',

}
function openModal(name, rec){
  setCodeHLCtx(null);   // 弹窗内不参与函数源码的变量类型推导
  const el = document.getElementById('typeModal');
  const e = rec.entry;
  const isConst = e.value !== undefined && e.def === undefined;
  const kindLabel = isConst ? '常量' : (e.kind === 'enum' ? '枚举' : e.kind === 'periph' ? '外设寄存器' : e.kind === 'typedef' ? '类型别名' : '结构体');
  const defLine = isConst ? (e.src ? e.src : ('#define ' + name + '  ' + (e.value || ''))) : (e.def || '');
  let members;
  if (isConst) {
    members = `<tr><td><code>${esc(name)}</code></td><td><code>${esc(e.value || '')}</code></td><td>${esc(e.desc || '')}</td></tr>`;
  } else {
    members = (e.members || []).map(m => `
      <tr><td>${memberNameCell(m.name, name)}</td><td><code>${esc(m.value || m.type || '')}</code></td><td>${esc(m.desc || '')}</td></tr>`).join('');
  }
  el.innerHTML = `

    ${members ? `<table><tr><th style="width:190px">${isConst ? '名称' : '成员'}</th><th style="width:190px">${isConst ? '值' : '值 / 类型'}</th><th>说明</th></tr>${members}</table>` : ''}
    <div class="meta" style="margin-top:10px"><span>定义于: <code>${esc(e.file || '')}</code></span></div>`;
  el.classList.add('open');
  document.getElementById('mask').classList.add('open');
}
function closeModal(){
  document.getElementById('typeModal').classList.remove('open');
  document.getElementById('mask').classList.remove('open');
}
function doCopy(txt, btn){
  navigator.clipboard ? navigator.clipboard.writeText(txt)
    : (()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); })();
  const old = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(()=>btn.textContent=old, 1200);
}
function typeHash(name){ return '#type/' + encodeURIComponent(name); }
function regHash(name, ctx){ return '#reg/' + encodeURIComponent(name) + (ctx ? '@' + encodeURIComponent(ctx) : ''); }

/* ===== 视图状态 <-> URL hash: 支持鼠标侧键前进/后退 =====
   #m/模块id      模块视图
   #s/查询|范围列表|高亮  搜索视图(如 #s/HAL%20WRITE|name|1)
   #type/名 #reg/名  弹窗(沿用) */
function stateHash(){
  if (curTokens.length) return '#s/' + encodeURIComponent(qEl.value) + '|' + curScopes.join(',') + '|' + (curHL ? '1' : '0');
  return '#m/' + curModule;
}
function syncHash(push){
  const h = stateHash();
  if (location.hash === h) return;
  if (push) history.pushState(null, '', h); else history.replaceState(null, '', h);
}
function applySearchState(query, scopes, hl){
  qEl.value = query || '';
  document.querySelectorAll('input.sc').forEach(b => b.checked = (scopes || ['name']).includes(b.value));
  document.getElementById('hlMark').checked = hl !== false;
  applySearch(false);
}
function parseHash(){
  const h = location.hash;
  if (h.startsWith('#type/')) {
    const name = decodeURIComponent(h.slice(6));
    if (typeReg.has(name)) { showType(name); return; }
    if (constReg.has(name)) { showConst(name); return; }
  }
  if (h.startsWith('#reg/')) {
    const raw = decodeURIComponent(h.slice(5));
    const at = raw.indexOf('@');
    const name = at > 0 ? raw.slice(0, at) : raw;
    const ctx = at > 0 ? raw.slice(at + 1) : '';
    if (regReg.has(name)) { showReg(name, ctx); return; }
  }
  if (h.startsWith('#s/')) {
    closeModal();
    const parts = decodeURIComponent(h.slice(3)).split('|');
    applySearchState(parts[0] || '', parts[1] ? parts[1].split(',') : ['name'], parts[2] === undefined ? true : parts[2] === '1');
    return;
  }
  if (h.startsWith('#m/')) {
    const mod = decodeURIComponent(h.slice(3));
    closeModal();
    qEl.value = '';
    curModule = MODULES.some(x => x.moduleId === mod) ? mod : (MODULES[0] ? MODULES[0].moduleId : '');
    applySearch(true); render(); renderSide();
    return;
  }
  /* 无 hash: 回到初始(默认模块, 清空搜索) */
  closeModal();
  qEl.value = '';
  if (curModule !== (MODULES[0] ? MODULES[0].moduleId : '')) { curModule = MODULES[0] ? MODULES[0].moduleId : ''; applySearch(true); render(); renderSide(); }
}

/* ================= 事件绑定 ================= */
document.addEventListener('click', e => {
  const t = e.target;
  const fl = t.closest('a.fnlink, a.tlink[data-fn]');
  if (fl) {
    e.preventDefault();
    const name = fl.dataset.fn;
    const isPriv = fl.classList.contains('priv');
    /* 条目 → 名称搜索直达卡片; 私有函数 → "私有"范围搜索显示其卡片 */
    document.querySelectorAll('input.sc').forEach(b => b.checked = isPriv ? b.value === 'priv' : b.value === 'name');
    document.getElementById('hlMark').checked = true;
    qEl.value = name;
    applySearch(false);
    syncHash(true);          // 压入历史, 鼠标侧键可返回
    window.scrollTo({ top: 0 });
    return;
  }
  const rl = t.closest('a.tlink[data-reg]');
  if (rl) {
    e.preventDefault();
    const name = rl.dataset.reg;
    if (regReg.has(name)) { location.hash = regHash(name, rl.dataset.ctx); parseHash(); }
    return;
  }
  const tl = t.closest('a.tlink');
  if (tl) {
    e.preventDefault();
    const name = tl.dataset.type;
    if (typeReg.has(name) || constReg.has(name)) { location.hash = typeHash(name); parseHash(); }
    return;
  }
  if (t.closest('button.chip')) { location.hash = typeHash(t.dataset.const); parseHash(); return; }
  if (t.closest('.m-close')) { closeModal(); history.back(); return; }
  if (t.closest('#mask')) { closeModal(); history.back(); return; }
  if (t.closest('.copybtn')) {
    doCopy(t.dataset.copy, t);
    return;
  }
  if (t.closest('button.src-copy')) {
    const txt = t.closest('details.srcbox').querySelector('pre.codehl').textContent;
    doCopy(txt, t);
    return;
  }
  const sb = t.closest('nav.side button');
  if (sb) {
    curModule = sb.dataset.module;
    qEl.value = ''; applySearch(true); render();
    renderSide();
    syncHash(false);
    return;
  }
  const ct = t.closest('button.col-toggle');
  if (ct) {
    const col = ct.dataset.col, mod = ct.dataset.module;
    const cards = document.querySelectorAll(`#grp-${mod} .${col}-col details.card`);
    const wantOpen = ct.textContent.includes('展开');
    cards.forEach(c => { if (wantOpen) c.setAttribute('open',''); else c.removeAttribute('open'); });
    ct.textContent = wantOpen ? '全部收起' : '展开全部';
    return;
  }
});
window.addEventListener('hashchange', parseHash);
window.addEventListener('popstate', parseHash);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('typeModal').classList.contains('open')) { closeModal(); history.back(); } });
window.addEventListener('scroll', () => { document.getElementById('toTop').style.display = window.scrollY > 600 ? 'block' : 'none'; });
document.getElementById('toTop').addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

/* ================= 悬停同名标识符高亮 =================
   鼠标落在源码里任一标识符(参数/局部变量/宏/函数/类型/常量)上 → 高亮**同一代码块内**所有同名 token。
   缓亮缓灭: 高亮用 CSS transition, 熄灭延迟 130ms(期间移到别的标识符则取消熄灭, 快速划动不会闪) */
const VAR_FADE_MS = 130;
let hlVarScope = null, hlVarName = '', hlVarEls = [], hlVarTimer = null;
function clearVarHl(){
  for (const el of hlVarEls) el.classList.remove('hl-var');
  hlVarEls = []; hlVarName = ''; hlVarScope = null;
}
function applyVarHl(el){
  // 作用域 = 卡片正文(签名 + 参数表 + 源码联动); 卡片摘要(展开前预览)不参与, 见 renderFuncCard
  const scope = el.closest('.card-body') || el.closest('pre.codehl') || el.parentElement;
  if (!scope) return;
  const name = el.dataset.var;
  if (!name) return;
  if (name === hlVarName && scope === hlVarScope) return;   // 同一名字/同一块 → 不动, 避免自闪
  for (const x of hlVarEls) x.classList.remove('hl-var');   // 旧的高亮淡出(过渡), 新的淡入
  hlVarScope = scope; hlVarName = name;
  hlVarEls = [...scope.querySelectorAll('[data-var]')].filter(x => x.dataset.var === name);
  for (const x of hlVarEls) x.classList.add('hl-var');
}
document.addEventListener('mouseover', e => {
  const t = e.target && e.target.closest ? e.target.closest('[data-var]') : null;
  if (t) {
    if (hlVarTimer) { clearTimeout(hlVarTimer); hlVarTimer = null; }   // 落在标识符上 → 撤销熄灭
    applyVarHl(t);
    return;
  }
  // 移到非标识符处(含移出代码块/移出窗口): 延迟熄灭
  if (hlVarEls.length && !hlVarTimer) hlVarTimer = setTimeout(() => { hlVarTimer = null; clearVarHl(); }, VAR_FADE_MS);
});
window.addEventListener('blur', () => { if (hlVarTimer) { clearTimeout(hlVarTimer); hlVarTimer = null; } clearVarHl(); });

/* 搜索输入(防抖) */
const qEl = document.getElementById('q');
let searchTimer = null;
function applySearch(silent){
  curTokens = tokenize(qEl.value);
  curCase = document.getElementById('caseSens').checked;
  const boxes = [...document.querySelectorAll('input.sc:checked')].map(b => b.value);
  curScopes = boxes.length ? boxes : ['name'];   // 全不选时退化为仅名称
  curHL = document.getElementById('hlMark').checked;
  if (!silent) render();
}
qEl.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { applySearch(false); syncHash(false); }, 120); });
document.getElementById('caseSens').addEventListener('change', () => { applySearch(false); syncHash(false); });
document.getElementById('hlMark').addEventListener('change', () => { applySearch(false); syncHash(false); });
document.querySelectorAll('input.sc').forEach(r => r.addEventListener('change', () => { applySearch(false); syncHash(false); }));

/* ================= 初始化 ================= */
function init(){
  buildIndex();
  if (!curModule && MODULES.length) curModule = MODULES[0].moduleId;
  renderSide();
  render();
  parseHash();
  syncHash(false);
}
const dataEl = document.getElementById('docdata');
const embeddedText = dataEl ? dataEl.textContent.trim() : '';
function applyData(d){
  MODULES = d.modules || [];
  REGS = d.registers || [];
  PRIVATES = d.privates || [];
  loadCallGraph(d.callgraph);
  init();
}
/* 拆分版加载器: 按 data/index.json 清单逐个取原始模块 JSON, 用与构建期同一份 mergeModules 在运行期组装。
   好处: 部署目录 = 工程 data/ 的镜像, 改哪个模块只需重传那一个文件, 不再有巨型合并产物。 */
async function loadSplitData(){
  const base = 'data/';
  const getJson = async (name) => {
    const r = await fetch(base + name);
    if (!r.ok) throw new Error(name + ' HTTP ' + r.status);
    return r.json();
  };
  const idx = await getJson('index.json');
  const mods = await Promise.all((idx.moduleFiles || []).map(getJson));
  const regs = await getJson(idx.registersFile || 'registers_merged.json');
  const cg = idx.callgraphFile ? await getJson(idx.callgraphFile) : { callgraph: {}, privates: [] };
  applyData({
    modules: mergeModules(mods, idx.order, idx.displayName),
    registers: (regs && regs.registers) || [],
    callgraph: (cg && cg.callgraph) || {},
    privates: (cg && cg.privates) || []
  });
}
function loadFail(msg){
  document.getElementById('main').innerHTML =
    '<div class="empty-hint">' + msg + ' —— 请通过 HTTP 服务(如 nginx / GitHub Pages)访问本目录, 或改用单文件版手册。</div>';
}
if (embeddedText && embeddedText !== '/*__DATA_JSON__*/') {
  applyData(JSON.parse(embeddedText));          // 单文件版: 数据已内嵌
} else {
  /* 拆分版: 优先走 data/index.json + 逐模块加载; 万一目录里还留着旧的 data.json 则回退 */
  loadSplitData().catch(err => {
    fetch('data.json')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(applyData)
      .catch(() => loadFail('无法加载 data/index.json 与 data.json(' + (err && err.message ? err.message : err) + ')'));
  });
}
</script>
