<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具导航</title>
<style>
  body{margin:0;font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;background:#1b1d21;color:#dcdfe4}
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:#9b9ea8;margin-bottom:28px}
  .card{display:flex;align-items:center;gap:16px;border:1px solid #33363d;border-radius:8px;padding:16px 18px;margin-bottom:14px;text-decoration:none;color:#dcdfe4;background:#222428}
  .card:hover{border-color:#3d5075;background:#26292e}
  .card .name{font-size:16px;font-weight:700;color:#8ab4f8}
  .card .desc{font-size:12.5px;color:#9b9ea8;margin-top:2px}
  .card .go{margin-left:auto;color:#6b7078;font-size:18px}
  footer{color:#6b7078;font-size:12px;margin-top:30px}
  /* 新增工具: 复制下面的 .card 一块, 改 href/name/desc 即可 */
</style>
</head>
<body>
<div class="wrap">
  <h1>工具导航</h1>
  <div class="sub">咪</div>

  <a class="card" href="./py32-driver-compass/">
    <div>
      <div class="name">PY32_Driver_Compass</div>
      <div class="desc">PY32F002B HAL/LL 驱动库交互式参考手册</div>
    </div>
    <span class="go">→</span>
  </a>

  <!--
  <a class="card" href="./your-tool/">
    <div>
      <div class="name">Your Tool</div>
      <div class="desc">描述...</div>
    </div>
    <span class="go">→</span>
  </a>
  -->

  <footer>由 GitHub Pages 托管</footer>
</div>
</body>
</html>
